# cline2api behind nginx. The important part is disabling buffering so SSE
# streams reach the client token-by-token instead of arriving in bursts.
#
#   /etc/nginx/conf.d/cline2api.conf

upstream cline2api_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cline.example.com;

    ssl_certificate     /etc/letsencrypt/live/cline.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cline.example.com/privkey.pem;

    # Model responses can be long; do not time out mid-stream.
    client_max_body_size 32m;
    client_body_timeout  300s;

    location / {
        proxy_pass http://cline2api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # --- SSE correctness ---
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Long-lived streams must not be compressed or altered.
        gzip off;
        add_header X-Accel-Buffering no;
    }
}
