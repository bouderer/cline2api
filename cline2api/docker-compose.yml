services:
  cline2api:
    build: .
    image: cline2api:latest
    restart: unless-stopped
    # Bind to loopback by default; put nginx/Caddy in front for TLS.
    ports:
      - "127.0.0.1:8787:8787"
      # Optional localhost callback login; expose only the port the browser uses.
      # - "127.0.0.1:48801-48811:48801-48811"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      LOG_LEVEL: info
      PROXY_API_KEY: ${PROXY_API_KEY:?set PROXY_API_KEY in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      # Holds accounts.json and the generated client key. Back this up.
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
